spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://localhost:3307/inventorydb
    username: inventorydb
    password: password

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 0
  address: 0.0.0.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    instanceId: ${spring.application.name}:${random.uuid}